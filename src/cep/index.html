<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chandelier</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 12px/1.45 -apple-system, "Segoe UI", sans-serif;
    background: #323232; color: #ddd; }
  .tabs { display: flex; flex: none; border-bottom: 1px solid #444; }
  .tab { flex: none; display: flex; align-items: center; gap: 5px; padding: 6px 12px; font: inherit; color: #aaa;
    background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.active { color: #fff; border-bottom-color: #2d6fd3; }
  .page { display: none; flex: 1; min-height: 0; padding: 8px 10px; box-sizing: border-box; }
  .page.active { display: flex; flex-direction: column; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #777; flex: none; }
  .dot.on { background: #4caf7a; }
  .dot.err { background: #d9534f; }
  .muted { color: #999; }
  /* Chat */
  #log { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  #log li { padding: 5px 0; border-bottom: 1px solid #3c3c3c; white-space: pre-wrap; overflow-wrap: anywhere; }
  #log li b { font-weight: 600; }
  #log li.me b { color: #8cc8ff; }
  #log li.agent b { color: #9fe0b5; }
  #log li.empty { color: #888; border: 0; }
  #activity { flex: none; display: none; align-items: center; gap: 6px; margin-top: 6px; color: #aaa; font-size: 11px; }
  #activity.on { display: flex; }
  #activity .dots { display: none; gap: 3px; }
  #activity.busy .dots { display: inline-flex; }
  #activity .dots i { width: 5px; height: 5px; border-radius: 50%; background: #9fe0b5; animation: blink 1.2s infinite ease-in-out; }
  #activity .dots i:nth-child(2) { animation-delay: .2s; }
  #activity .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  #compose { flex: none; display: flex; gap: 6px; margin-top: 8px; }
  #msg { flex: 1; min-height: 34px; max-height: 120px; resize: vertical; box-sizing: border-box; padding: 4px 6px;
    font: inherit; color: #eee; background: #262626; border: 1px solid #555; border-radius: 3px; }
  #send { align-self: flex-end; padding: 4px 10px; font: inherit; color: #fff; background: #2d6fd3; border: 0;
    border-radius: 3px; cursor: pointer; }
  #send:disabled { background: #555; color: #999; cursor: default; }
  /* Status */
  .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  label { display: flex; align-items: center; gap: 6px; margin: 8px 0; cursor: pointer; }
  #events { margin: 4px 0 0; padding: 0; list-style: none; border-top: 1px solid #444; overflow-y: auto; }
  #events li { padding: 4px 0; border-bottom: 1px solid #3c3c3c; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #events li b { font-weight: 600; color: #fff; }
  code { font: 11px ui-monospace, Menlo, Consolas, monospace; color: #bbb; }
</style>
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-page="chat">Chat</button>
    <button class="tab" data-page="status"><span id="dot" class="dot"></span>Status</button>
  </nav>

  <section class="page active" id="page-chat">
    <ol id="log"><li class="empty">Write to the agent below. With something selected, "this" means the selection.</li></ol>
    <div id="activity"><span class="dots"><i></i><i></i><i></i></span><span id="activity-text"></span></div>
    <div id="compose">
      <textarea id="msg" rows="2" placeholder="Write to the agent… (⌘/Ctrl+Enter)"></textarea>
      <button id="send" disabled>Send</button>
    </div>
  </section>

  <section class="page" id="page-status">
    <div class="row"><span id="status">Starting…</span></div>
    <div class="row muted" id="agents">No agent connected</div>
    <label><input type="checkbox" id="share" checked> Share my selection and document changes with the agent</label>
    <div class="muted" id="hint">The agent reads chat messages while it waits for events.</div>
    <div class="muted" style="margin-top: 8px">Recent events</div>
    <ol id="events"><li class="muted">Nothing yet</li></ol>
  </section>

  <script src="panel.js"></script>
</body>
</html>
